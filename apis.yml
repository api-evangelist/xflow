aid: xflow
name: Xflow
description: Xflow is a cross-border payments platform for Indian businesses, freelancers,
  and exporters, enabling them to receive international payments through local collection
  accounts (ACH in the US, SEPA in the EU) with one-day INR settlement, transparent
  FX at mid-market rates, and automated FIRA and compliance reporting. The Xflow REST
  API exposes accounts, receivables, payment links, deposits, payouts, transfers,
  balances, exchange rates, and webhook endpoints so platforms and payment aggregators
  can embed compliant India-bound money movement.
