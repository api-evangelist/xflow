generated: '2026-07-21'
method: searched
source: https://docs.xflowpay.com/latest/guide#webhooks
spec_type: Webhooks
notes: Xflow publishes no AsyncAPI document; this captures the documented webhook
  surface. Event types below are enumerated verbatim from the OpenAPI event schema
  (event.properties.type enum); delivery semantics from the integration guide.
delivery:
  transport: HTTPS POST (HTTPS-only endpoints enforced)
  management: webhook_endpoint objects via /v1/webhook_endpoints (create, update,
    activate, deactivate; enabled_events subscription list; per-endpoint secret)
  signatures: Signed payloads — construct the signed content, compute the expected
    signature with the endpoint secret, verify the timestamp
  retries: Automatic retry on delivery failure
  duplicates: Duplicate event delivery possible; consumers must handle idempotently
  source_ips: Documented allowlist of webhook source IP addresses
